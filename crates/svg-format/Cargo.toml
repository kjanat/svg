[package]
name                   = "svg-format"
version.workspace      = true
authors.workspace      = true
edition.workspace      = true
rust-version.workspace = true
description            = "Structural formatter for SVG documents"
homepage               = "https://github.com/kjanat/svg/tree/HEAD/crates/svg-format"
repository.workspace   = true
license.workspace      = true
keywords               = ["format", "pretty-print", "svg", "tree-sitter"]
categories             = ["development-tools", "text-editors"]
include                = ["/README.md", "/src/*", "/tests/*", "/examples/*"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/svg-v{ version }-{ target }{ archive-suffix }"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[features]
default = ["cli"]
cli     = ["clap"]

[lib]
name = "svg_format"
path = "src/lib.rs"

[[bin]]
name              = "svg-format"
path              = "src/main.rs"
required-features = ["cli"]

[dependencies]
tree-sitter.workspace = true

tree-sitter-svg.workspace      = true
tree-sitter-svg-path.workspace = true

[dependencies.clap]
workspace = true
features  = ["derive"]
optional  = true

[lints]
workspace = true

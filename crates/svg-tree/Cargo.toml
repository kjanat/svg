[package]
name                   = "svg-tree"
version.workspace      = true
authors.workspace      = true
edition.workspace      = true
rust-version.workspace = true
description            = "Shared tree-sitter traversal helpers for SVG workspace crates"
readme                 = "README.md"
homepage               = "https://github.com/kjanat/svg/tree/HEAD/crates/svg-tree"
repository.workspace   = true
license.workspace      = true
keywords               = ["svg", "traversal", "tree-sitter"]
categories             = ["development-tools"]
include                = ["/README.md", "/src/*"]

[features]
cli = ["dep:clap", "dep:clap_complete"]

[dependencies]
clap                  = { workspace = true, features = ["derive"], optional = true }
clap_complete         = { workspace = true, optional = true }
tree-sitter.workspace = true

[dev-dependencies]
tree-sitter-svg.workspace = true

[lints]
workspace = true

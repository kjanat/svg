name: dist artifact
description: >-
  Download the tarred npm dist artifact from its producer run and extract it
  to distribution/npm/dist/, with the original archives in downloads/ for runtime checks.
  The artifact is a tarball because the zip-based artifact store
  drops unix file modes; extraction restores the executable bits.

inputs:
  run-id:
    description: release.yml or runtime-smoke-ci.yml run ID that produced the `dist` artifact
    required: true
  token:
    description: token with `actions:read` on this repo
    required: true

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with: { name: dist, path: distribution/npm/, run-id: "${{ inputs.run-id }}", github-token: "${{ inputs.token }}" }

    - shell: node {0}
      run: |
        require('node:child_process').execFileSync('tar', ['-xf', 'distribution/npm/dist.tar', '-C', 'distribution/npm'], { stdio: 'inherit' });
        require('node:fs').unlinkSync('distribution/npm/dist.tar');

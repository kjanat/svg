name: package asset
description: >-
  Package built binaries into a release tarball and its SHA-256 checksum.
  Used for tier-3 targets requiring `-Z build-std`.

inputs:
  tag:
    description: release tag (vX.Y.Z)
    required: true
  target:
    description: rust target triple; also names the archive
    required: true
  bin-dir:
    description: directory containing the built binaries
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        RELEASE_TAG: ${{ inputs.tag }}
        TARGET: ${{ inputs.target }}
        BIN_DIR: ${{ inputs.bin-dir }}
      run: bash "${GITHUB_ACTION_PATH}/run.sh"

name: beepboop report
description: >-
  Report one registry publication to the Beepboop execution that granted the
  publishing credential.

inputs:
  execution-id:
    description: Beepboop execution ID
    required: true
  manager:
    description: Registry manager, cargo or npm
    required: true
  name:
    description: Package name as the registry lists it
    required: true
  version:
    description: Published version or its vX.Y.Z release tag
    required: true
  result:
    description: Outcome of the publish step (success, failure, cancelled or skipped)
    required: true
  skipped:
    description: true when the publisher skipped an optional package missing from the artifact
    required: false
    default: "false"
  required:
    description: false for an optional package
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - id: publication
      shell: bash
      env:
        MANAGER: ${{ inputs.manager }}
        PACKAGE_NAME: ${{ inputs.name }}
        VERSION: ${{ inputs.version }}
        RESULT: ${{ inputs.result }}
        SKIPPED: ${{ inputs.skipped }}
        REQUIRED: ${{ inputs.required }}
      run: bash "${GITHUB_ACTION_PATH}/run.sh"
    - uses: kjanat/beepboop/actions/report@v1
      with:
        execution-id: ${{ inputs.execution-id }}
        publications: ${{ steps.publication.outputs.publications }}

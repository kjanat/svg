name: Tree-sitter SVG

on:
  pull_request:
    paths: &Paths
      - ".github/workflows/refresh-spec.yml"
      - ".github/workflows/tree-sitter-svg.yml"
      - "bun.lock"
      - "crates/svg-data-regen/**"
      - "crates/svg-data/data/**"
      - "editors/zed-svg/languages/**"
      - "grammars/**"
      - "justfile"
      - "package.json"
      - "scripts/generate-grammars.ts"
  push: { branches: [master], paths: *Paths }
  workflow_dispatch: null

permissions: { contents: read }
concurrency:
  group: tree-sitter-svg-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
defaults: { run: { working-directory: grammars/tree-sitter-svg } }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: kjanat/runner@v0.26.2
      - uses: taiki-e/install-action@just
      - uses: actions/setup-node@v7
        with: { node-version-file: package.json }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: package.json }
      - uses: astral-sh/setup-uv@v10.1.0
      - uses: denoland/setup-deno@v2
      - name: Install workspace dependencies
        working-directory: .
        run: bun install --frozen-lockfile
      - name: Check all generated grammars and their consumers
        working-directory: .
        run: just check-grammars
      - run: runner run --pm bun --sequential --keep-going
          typecheck
          test:corpus
          test:fuzz
          parse:examples
          test
          test:bun
          test:regex

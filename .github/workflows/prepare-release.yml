name: Prepare release
run-name: ${{ inputs.beepboop_title || github.workflow }}
on:
  workflow_dispatch:
    inputs:
      beepboop_execution_id: { required: true, type: string }
      beepboop_title: { required: false, type: string }
permissions: { contents: read, id-token: write }
concurrency: { group: prepare-release, cancel-in-progress: false }
jobs:
  prepare:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: kjanat/beepboop/actions/begin@v1
        id: begin
        with:
          execution-id: ${{ inputs.beepboop_execution_id }}
          stream: main
          operation: prepare
      - name: Bind approved source to the dispatched revision
        env:
          APPROVED_SOURCE: ${{ fromJSON(steps.begin.outputs.context).sourceSha }}
          DISPATCHED_SOURCE: ${{ github.sha }}
          DISPATCHED_REF: ${{ github.ref }}
        run: |
          test "${DISPATCHED_REF}" = refs/heads/master
          test "${APPROVED_SOURCE}" = "${DISPATCHED_SOURCE}"
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: taiki-e/install-action@v2
        with: { tool: "just,tombi,shellcheck,rust+clippy+rustfmt" }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: package.json }
      - uses: actions/setup-node@v7
        with: { node-version: "26" }
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: denoland/setup-deno@v2
      - uses: kjanat/setup-zig@v3.0.0
        with: { version: 0.16.0 }
      - name: Install pinned workflow validator
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          tool_dir="${RUNNER_TEMP}/actionlint"
          mkdir -p "${tool_dir}"
          gh release download v1.17.1 --repo kjanat/actionlint --pattern actionlint_1.17.1_linux_amd64.tar.gz --dir "${tool_dir}"
          cd "${tool_dir}"
          echo '6bfe0f49f0e108b9b23732baf7de63bfa4d89174fa40f9cb98feb9676df3318f  actionlint_1.17.1_linux_amd64.tar.gz' | sha256sum --check -
          tar -xzf actionlint_1.17.1_linux_amd64.tar.gz
          echo "${tool_dir}" >> "${GITHUB_PATH}"
      - name: Refresh lockfiles and generated grammar versions
        env: { RELEASE_VERSION: "${{ fromJSON(steps.begin.outputs.context).version }}" }
        run: |
          bun scripts/release-version.ts "${RELEASE_VERSION}"
          cargo check --workspace
          bun install --lockfile-only --ignore-scripts
          uv lock
          bun install --frozen-lockfile
          just generate-grammars
          just format --diff
      - run: just verify
      - uses: kjanat/beepboop/actions/token@v1
        id: automation
        with:
          execution-id: ${{ steps.begin.outputs.execution-id }}
          permission-pull-requests: write
      - uses: kjanat/beepboop/actions/pull-request@v1
        id: pr
        with:
          branch: release/next-version
          base: master
          title: "chore(release): v${{ fromJSON(steps.begin.outputs.context).version }}"
          body: |-
            Prepare v${{ fromJSON(steps.begin.outputs.context).version }} with coordinated manifests, lockfiles and generated grammar metadata.

            Validation: `just verify`. Review the release notes before merging. Publication requires approval in Beepboop.
      - name: Label release preparation PR
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ steps.automation.outputs.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
        run: |
          gh pr edit "${PR_NUMBER}" --add-label 'area: build' --add-label 'type:task'

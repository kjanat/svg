name: Prepare release
run-name: ${{ inputs.beepboop_title || github.workflow }}
on:
  workflow_dispatch:
    inputs:
      beepboop_execution_id: { required: true, type: string }
      beepboop_title: { required: false, type: string }
permissions: { contents: read, id-token: write }
concurrency: { group: prepare-release, cancel-in-progress: false }
jobs:
  prepare:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: kjanat/beepboop/actions/begin@v1
        id: begin
        with:
          execution-id: ${{ inputs.beepboop_execution_id }}
          stream: main
          operation: prepare
      - name: Refuse a dispatch away from the approved source
        if: github.ref != 'refs/heads/master' || fromJSON(steps.begin.outputs.context).sourceSha != github.sha
        run: exit 1
      - uses: actions/checkout@v7
        with: { ref: "${{ github.sha }}", persist-credentials: false }
      - parallel:
          - uses: taiki-e/install-action@v2
            with: { tool: "just,tombi,rust+clippy+rustfmt" }
          - uses: oven-sh/setup-bun@v2
            with: { bun-version-file: package.json }
          - uses: actions/setup-node@v7
            with: { node-version: "26" }
          - uses: astral-sh/setup-uv@v10.3.3
          - uses: denoland/setup-deno@v2
          - uses: kjanat/setup-zig@v3.0.0
            with: { version: 0.16.0 }
      - name: Raise every version carrier
        env: { RELEASE_VERSION: "${{ fromJSON(steps.begin.outputs.context).version }}" }
        run: bun scripts/release-version.ts "${RELEASE_VERSION}"

      - parallel:
          - name: Refresh Cargo.lock
            run: cargo check --workspace
          - name: Refresh bun.lock
            run: bun install --lockfile-only --ignore-scripts
          - name: Refresh uv.lock
            run: uv lock
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Regenerate grammars
        run: just generate-grammars
      - name: Check formatting
        run: bunx kfmt --diff
      - run: just verify

      - uses: kjanat/beepboop/actions/token@v1
        id: automation
        with:
          execution-id: ${{ steps.begin.outputs.execution-id }}
          permission-pull-requests: write
      - uses: kjanat/beepboop/actions/pull-request@v1
        id: pr
        with:
          branch: release/next-version
          base: master
          title: "chore(release): v${{ fromJSON(steps.begin.outputs.context).version }}"
          body: |
            Prepare v${{ fromJSON(steps.begin.outputs.context).version }} with coordinated manifests, lockfiles and generated grammar metadata.

            Review the release notes before merging.
            **Merging publishes** the release *once its checks pass*.
      - name: Label release preparation PR
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ steps.automation.outputs.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
        run: gh pr edit "${PR_NUMBER}" --add-label release

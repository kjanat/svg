name: Prepare release
run-name: ${{ inputs.beepboop_title || github.workflow }}
on:
  workflow_dispatch:
    inputs:
      beepboop_execution_id: { required: true, type: string }
      beepboop_title: { required: false, type: string }
permissions: { contents: read, id-token: write }
concurrency: { group: prepare-release, cancel-in-progress: false }
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: kjanat/beepboop/actions/begin@v1
        id: begin
        with:
          execution-id: ${{ inputs.beepboop_execution_id }}
          stream: main
          operation: prepare
      - uses: actions/checkout@v7
        with:
          ref: ${{ fromJSON(steps.begin.outputs.context).sourceSha }}
          persist-credentials: false
      - uses: taiki-e/install-action@v2
        with: { tool: "just,tombi,rust+clippy+rustfmt" }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: package.json }
      - uses: actions/setup-node@v7
        with: { node-version: "24" }
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: denoland/setup-deno@v2
      - uses: mlugg/setup-zig@v2
        with: { version: 0.16.0 }
      - uses: Swatinem/rust-cache@v2
      - name: Refresh lockfiles and generated grammar versions
        env: { RELEASE_VERSION: "${{ fromJSON(steps.begin.outputs.context).version }}" }
        run: |
          node scripts/release-version.mjs "${RELEASE_VERSION}"
          cargo check --workspace
          bun install --lockfile-only --ignore-scripts
          uv lock
          bun install --frozen-lockfile
          just generate-grammars
          just format --diff
      - run: just verify
      - uses: kjanat/beepboop/actions/token@v1
        id: automation
        with:
          execution-id: ${{ steps.begin.outputs.execution-id }}
          permission-pull-requests: write
      - uses: kjanat/beepboop/actions/pull-request@v1
        id: pr
        with:
          branch: release/next-version
          base: master
          title: "chore(release): v${{ fromJSON(steps.begin.outputs.context).version }}"
          body: |-
            Prepare v${{ fromJSON(steps.begin.outputs.context).version }} with coordinated manifests, lockfiles and generated grammar metadata.

            Validation: `just verify`. Review the release notes before merging. Publication requires approval in Beepboop.
      - name: Label release preparation PR
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ steps.automation.outputs.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
        run: |
          gh pr edit "${PR_NUMBER}" --add-label 'area: build' --add-label 'type:task'

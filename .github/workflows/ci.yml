name: CI

on: { pull_request: {}, push: { branches: [master] } }
permissions: { contents: read }
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-check:
    name: versions
    permissions: { contents: read }
    uses: $/.github/workflows/version-check.yml

  rust:
    name: Rust (clippy + test)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: taiki-e/install-action@v2
        with: { tool: rust+clippy }
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets --all-features -- -D clippy::all -D warnings
      - name: Test
        run: cargo test --workspace

  shell-completions:
    name: Shell completions
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: taiki-e/install-action@v2
        with: { tool: rust }
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends expect fish zsh
      - name: Exercise completions from a native release archive
        run: |
          cargo build --locked --bin svg-format --bin svg-lint --bin svg-language-server
          bash scripts/generate-shell-completions.sh target/debug completions
          RELEASE_TAG=v0.0.0 TARGET=x86_64-unknown-linux-gnu BIN_DIR=target/debug bash .github/actions/package-asset/run.sh
          sha256sum --check svg-v0.0.0-x86_64-unknown-linux-gnu.sha256
          mkdir extracted
          tar -xzf svg-v0.0.0-x86_64-unknown-linux-gnu.tar.gz -C extracted
          bash scripts/test-shell-completions.sh extracted extracted/completions

  wasm:
    name: Wasm allocator regression
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: taiki-e/install-action@v2
        with: { tool: "rust,just" }
      - uses: actions/setup-node@v7
        with: { node-version-file: package.json }
      - uses: Swatinem/rust-cache@v2
      - run: rustup target add wasm32-unknown-unknown
      - run: just test-wasm

  format:
    name: kprint check
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: package.json }
      - uses: taiki-e/install-action@v2
        with: { tool: "just,tombi,rust+rustfmt" }
      - uses: kjanat/setup-zig@v3.0.0
        with: { version: 0.16.0 }
      - uses: Swatinem/rust-cache@v2
      - uses: kjanat/dprint-check@v3

  python:
    name: Python tools and installed wheels
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: taiki-e/install-action@v2
        with: { tool: just }
      - run: just check-python

  npm-facade:
    name: npm facade (glibc + musl)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version-file: package.json }
      - name: Resolve pinned Node major
        run: echo "NODE_MAJOR=$(jq -r '.volta.node | split(".")[0]' package.json)" >> "${GITHUB_ENV}"
      - name: Resolver tests (glibc host)
        env: { EXPECT_LIBC: glibc }
        run: node --test "distribution/npm/facade/test/*.test.mjs"
      - name: Resolver tests (musl host)
        run: docker run --rm --volume "${PWD}:/work" --workdir /work
          --env EXPECT_LIBC=musl "node:${NODE_MAJOR}-alpine"
          node --test "distribution/npm/facade/test/*.test.mjs"

  deno:
    name: Deno typecheck
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - name: Typecheck Deno scripts
        run: deno check scripts/release-prepare.ts scripts/baseline-icons.ts
      - name: Verify compatibility deployment
        run: deno task check:deploy

  crates:
    name: Packaged crates (no uploads)
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env: { PYTHONDONTWRITEBYTECODE: "1" }
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: taiki-e/install-action@v2
        with: { tool: "rust,just" }
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-node@v7
        with: { node-version: "26" }
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Release tooling regressions
        run: just release-package-test
      - name: verify actual workspace packages without uploading
        shell: python
        run: |
          import os
          import runpy
          import subprocess
          import tomllib

          with open("Cargo.toml", "rb") as manifest:
              version = tomllib.load(manifest)["workspace"]["package"]["version"]
          os.environ.update(
              SOURCE_DIR=".",
              PROOF_DIR=os.path.join(os.environ["RUNNER_TEMP"], "verified-crates"),
              RELEASE_TAG=f"v{version}",
              HELPER_SHA=subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
          )
          runpy.run_path(".github/actions/crates-verify/verify.py", run_name="__main__")

# Beepboop-approved dispatch pipeline. Multi-step logic lives in .github/actions/*.
#
#   verify ────────────────── cargo clippy + cargo test
#     ├─ create-release ───── draft GH release + notes
#     │    └─ build-and-upload ─ per-target build matrix (needs: matrix);
#     │                          actions/package-asset|verify-asset
#     └─ matrix ───────────── actions/release-matrix from distribution/npm/targets.json
#   build-dist (needs: build-and-upload)
#     └─ actions/download-archives → build-packages.ts;
#        artifact `dist` (tarred: keeps exec bits)
#   runtime-smoke (needs: build-dist) ── required native/Alpine artifact checks
#   publish-release (needs: runtime-smoke) ── draft → published
#     └─ call-npm-release ──→ npm-release.yml: setup → runtime-smoke
#                              → per-package publish matrix → facades (actions/npm-publish)
---
name: release
run-name: ${{ inputs.beepboop_title || github.workflow }}
on:
  workflow_dispatch:
    inputs:
      beepboop_execution_id: { required: true, type: string }
      beepboop_title: { required: false, type: string }
# Serialize approved releases without cancelling an active publish mid-flight.
concurrency: { group: release, cancel-in-progress: false }
permissions: { contents: read }
env: { CARGO_TERM_COLOR: always }

jobs:
  version-check:
    needs: beepboop
    name: versions
    permissions: { contents: read }
    uses: $/.github/workflows/version-check.yml
    with: { ref: "${{ needs.beepboop.outputs.source-sha }}", expected-version: "${{ needs.beepboop.outputs.version }}" }

  verify:
    needs: beepboop
    name: verify
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ needs.beepboop.outputs.source-sha }}", persist-credentials: false }
      - uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with: { tool: rust+clippy }
      - run: cargo clippy --workspace --all-targets --all-features -- -D clippy::all -D warnings
      - run: cargo test --workspace

      - name: build native binaries
        run: cargo build --locked --bin svg-format --bin svg-lint --bin svg-language-server

      - name: generate shell completions with native binaries
        run: bash scripts/generate-shell-completions.sh target/debug completions

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: shell-completions, path: completions, if-no-files-found: error }

  beepboop:
    name: register approved release
    runs-on: ubuntu-26.04
    permissions: { contents: read, id-token: write }
    outputs:
      execution-id: ${{ steps.begin.outputs.execution-id }}
      source-sha: ${{ fromJSON(steps.begin.outputs.context).sourceSha }}
      version: ${{ fromJSON(steps.begin.outputs.context).version }}
      tag: v${{ fromJSON(steps.begin.outputs.context).version }}
    steps:
      - uses: kjanat/beepboop/actions/begin@v1
        id: begin
        with:
          execution-id: ${{ inputs.beepboop_execution_id }}
          stream: main
          operation: promote

  create-release:
    name: create draft release
    needs: [verify, version-check, beepboop]
    runs-on: ubuntu-26.04
    permissions: { contents: read, id-token: write }
    steps:
      - uses: kjanat/beepboop/actions/token@v1
        id: automation
        with:
          execution-id: ${{ needs.beepboop.outputs.execution-id }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ github.sha }}", fetch-depth: 0, persist-credentials: false }

      - name: Require a verified signature on the exact release commit
        env:
          GH_TOKEN: ${{ steps.automation.outputs.token }}
          SOURCE_SHA: ${{ needs.beepboop.outputs.source-sha }}
        run: |
          verified=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SOURCE_SHA}" --jq '.commit.verification.verified')
          test "${verified}" = true
      - uses: kjanat/beepboop/actions/publish-refs@v1
        with: { token: "${{ steps.automation.outputs.token }}" }
        env:
          BEEPBOOP_EXECUTION_ID: ${{ needs.beepboop.outputs.execution-id }}
          GIT_AUTHOR_NAME: ${{ fromJSON(steps.automation.outputs.gitId).GIT_AUTHOR_NAME }}
          GIT_AUTHOR_EMAIL: ${{ fromJSON(steps.automation.outputs.gitId).GIT_AUTHOR_EMAIL }}
          GIT_COMMITTER_NAME: ${{ fromJSON(steps.automation.outputs.gitId).GIT_COMMITTER_NAME }}
          GIT_COMMITTER_EMAIL: ${{ fromJSON(steps.automation.outputs.gitId).GIT_COMMITTER_EMAIL }}

      - name: append GitHub auto-generated notes
        uses: $/.github/actions/append-release-notes
        with: { tag: "${{ needs.beepboop.outputs.tag }}", token: "${{ steps.automation.outputs.token }}" }

  matrix:
    name: build matrix
    needs: [verify, version-check, beepboop]
    runs-on: ubuntu-26.04
    permissions: { contents: read }
    outputs: { include: "${{ steps.gen.outputs.include }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.beepboop.outputs.source-sha }}
          sparse-checkout: ".github/actions\ndistribution/npm/targets.json"
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - id: gen
        uses: $/.github/actions/release-matrix

  build-and-upload:
    name: ${{ matrix.target }}
    needs: [matrix, create-release, beepboop]
    runs-on: ${{ matrix.runner }}
    # Tier-3 build-std legs compile core+std from source.
    timeout-minutes: 60
    permissions: { contents: read, id-token: write, attestations: write, artifact-metadata: write }
    strategy: { fail-fast: false, matrix: { include: "${{ fromJSON(needs.matrix.outputs.include) }}" } }
    continue-on-error: ${{ matrix.experimental }}
    env:
      # KAJ-274: windows-11-arm runners intermittently fail crate fetches with
      # HTTP/2 stream errors; forcing HTTP/1.1 there is the standard workaround.
      CARGO_HTTP_MULTIPLEXING: ${{ matrix.runner != 'windows-11-arm' }}
      CARGO_NET_RETRY: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ needs.beepboop.outputs.source-sha }}", persist-credentials: false }

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: shell-completions, path: completions }

      - name: install stable rust
        if: matrix.build-tool == 'cargo-cross-toolchain'
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with: { toolchain: stable, targets: "${{ matrix.target }}" }

      - name: install nightly rust (tier-3 build-std)
        if: matrix.build-tool == 'cross-build-std'
        uses: dtolnay/rust-toolchain@6a52aad76a94a5fbc50d567bb5be24419801c1fb # nightly
        with: { toolchain: nightly, components: rust-src }

      - name: install Cross release tools
        if: contains(fromJSON('["cross", "cross-build-std"]'), matrix.build-tool)
        uses: kjanat/mise-action@v6
        with:
          mise_env: release
          cache: false
          install_args: ${{ case(matrix.target == 'x86_64-unknown-linux-musl', 'cross cargo:rust-script', 'cross') }}

      # NetBSD's Cross image lacks the libexecinfo required by Rust's std.
      - name: setup NetBSD cross toolchain
        if: matrix.build-tool == 'cargo-cross-toolchain'
        uses: taiki-e/setup-cross-toolchain-action@0375eb1d01bea430aa3202965839a7092960a23b # v1.43.1
        with: { target: "${{ matrix.target }}" }

      - name: build and package binaries (taiki-e)
        if: contains(fromJSON('["cargo", "cross", "cargo-cross-toolchain"]'), matrix.build-tool)
        uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1
        with:
          dry-run: true
          dry-run-intended: true
          ref: refs/tags/${{ needs.beepboop.outputs.tag }}
          bin: "svg-language-server,svg-lint,svg-format"
          target: ${{ matrix.target }}
          build-tool: ${{ case(matrix.build-tool == 'cargo-cross-toolchain', 'cargo', matrix.build-tool) }}
          archive: svg-$tag-$target
          tar: all
          zip: none
          checksum: sha256
          include: "README.md,LICENSE,completions"
          locked: true

      # Tier-3: build/archive/upload manually since upload-rust-binary-action
      # has no input for extra Cargo build flags.
      - name: build with nightly Cross and build-std
        if: matrix.build-tool == 'cross-build-std'
        env: { target: "${{ matrix.target }}" }
        run: cross +nightly build --config .cargo/build-std.toml --release --locked --target "${target}"
          --bin svg-language-server --bin svg-lint --bin svg-format

      - name: package binaries (cross-build-std)
        if: matrix.build-tool == 'cross-build-std'
        uses: $/.github/actions/package-asset
        with:
          tag: ${{ needs.beepboop.outputs.tag }}
          target: ${{ matrix.target }}
          bin-dir: ${{ github.workspace }}/target/${{ matrix.target }}/release

      - uses: kjanat/actions-shells@v0
        if: matrix.target == 'x86_64-unknown-linux-musl'
        with: { doctor: true, runtimes: cross }

      - name: smoke-test native binaries under musl
        if: matrix.target == 'x86_64-unknown-linux-musl'
        shell: "actions-shell cross --target x86_64-unknown-linux-musl {0}"
        run: |
          assert!(cfg!(target_env = "musl"), "expected the musl target");
          let bin_dir = std::path::Path::new("target/x86_64-unknown-linux-musl/release");
          for bin in ["svg-format", "svg-lint", "svg-language-server"] {
              let result = std::process::Command::new(bin_dir.join(bin))
                  .arg("--version")
                  .output()
                  .unwrap_or_else(|error| panic!("could not start {bin}: {error}"));
              assert!(result.status.success(), "{bin}: {}", String::from_utf8_lossy(&result.stderr));
              let version = String::from_utf8_lossy(&result.stdout);
              assert!(version.starts_with(&format!("{bin} ")), "{bin}: {version}");
          }

      - name: attest release archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with: { subject-path: "svg-${{ needs.beepboop.outputs.tag }}-${{ matrix.target }}.tar.gz" }

      - uses: kjanat/beepboop/actions/token@v1
        id: automation
        with:
          execution-id: ${{ needs.beepboop.outputs.execution-id }}
          permission-contents: write
      - name: upload attested archive and checksum
        shell: bash
        env:
          GH_TOKEN: ${{ steps.automation.outputs.token }}
          release_tag: ${{ needs.beepboop.outputs.tag }}
          basename: ${{ format('svg-{0}-{1}', needs.beepboop.outputs.tag, matrix.target) }}
        run: gh release upload "${release_tag}" "${basename}.tar.gz" "${basename}.sha256" --clobber

      - name: verify asset uploaded
        uses: $/.github/actions/verify-asset
        with:
          tag: ${{ needs.beepboop.outputs.tag }}
          target: ${{ matrix.target }}
          token: ${{ steps.automation.outputs.token }}

  build-dist:
    name: build dist
    needs: [build-and-upload, beepboop]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions: { contents: read, id-token: write }
    env: { RELEASE_TAG: "${{ needs.beepboop.outputs.tag }}" }
    steps:
      - uses: kjanat/beepboop/actions/token@v1
        id: automation
        with:
          execution-id: ${{ needs.beepboop.outputs.execution-id }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ needs.beepboop.outputs.source-sha }}", persist-credentials: false }

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: latest }

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      # Packaging uses JavaScript dependencies; grammar addon builds are unrelated.
      - run: bun install --force --ignore-scripts

      - name: download and verify release archives
        uses: $/.github/actions/download-archives
        with: { tag: "${{ needs.beepboop.outputs.tag }}", token: "${{ steps.automation.outputs.token }}" }

      - name: build npm packages
        run: node distribution/npm/scripts/build-packages.ts --version "${RELEASE_TAG#v}"

      - name: report archive and package evidence
        run: node .github/actions/npm-smoke/runtime.mjs inventory

      - name: tar dist (preserve file modes)
        run: tar -cf distribution/npm/dist.tar -C distribution/npm dist downloads

      - name: upload dist artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: dist, path: distribution/npm/dist.tar, retention-days: 14, if-no-files-found: error }

  runtime-smoke:
    name: validate distributed runtimes
    needs: [build-dist, beepboop]
    permissions: { contents: read, actions: read }
    uses: $/.github/workflows/runtime-smoke.yml
    with:
      tag: ${{ needs.beepboop.outputs.tag }}
      run-id: ${{ github.run_id }}
      report-prefix: release-runtime

  publish-release:
    name: publish github release
    needs: [build-dist, runtime-smoke, beepboop]
    runs-on: ubuntu-26.04
    permissions: { contents: read, id-token: write }
    env: { RELEASE_TAG: "${{ needs.beepboop.outputs.tag }}" }
    steps:
      - uses: kjanat/beepboop/actions/token@v1
        id: automation
        with:
          execution-id: ${{ needs.beepboop.outputs.execution-id }}
          permission-contents: write
      - run: gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false
        env: { GH_TOKEN: "${{ steps.automation.outputs.token }}" }
      - uses: kjanat/beepboop/actions/publish-release@v1
        with: { execution-id: "${{ needs.beepboop.outputs.execution-id }}" }

  call-npm-release:
    name: npm publish
    needs: [publish-release, beepboop]
    permissions: { contents: read, id-token: write, actions: read }
    uses: $/.github/workflows/npm-release.yml
    with: { tag: "${{ needs.beepboop.outputs.tag }}", run-id: "${{ github.run_id }}", beepboop-execution-id: "${{ needs.beepboop.outputs.execution-id }}" }

  call-crates-release:
    name: crates publish
    needs: [publish-release, beepboop]
    permissions: { contents: read, id-token: write }
    uses: $/.github/workflows/crates-release.yml
    with: { tag: "${{ needs.beepboop.outputs.tag }}", beepboop-execution-id: "${{ needs.beepboop.outputs.execution-id }}" }

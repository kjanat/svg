#:schema kprint.schema.json

extends  = "https://raw.githubusercontent.com/kjanat/kjanat/refs/heads/master/configs/dprint.remote.json"
useTabs  = true
excludes = [
  "crates/svg-language-server/assets/baseline-*.svg",
  "workers/svg-compat/static/badges/baseline-*.svg",
  "**/*.lock",
  "**/fixtures",
  "**/grammars/tree-sitter-*/**/w3/*.svg",
  "**/grammars/tree-sitter-*/src/*.json",
  "**/grammars/tree-sitter-*/test/**",
  "**/node_modules",
  "**/samples/w3",
  "**/svg-data/data/sources/**",
  "**/svgwg",
  "**/target",
  "**/zed-svg/grammars",
  "*.fixture.svg",
  ".github/workflows/release.yml",
  "catalog.json",
  "single-page.html"
]

[jsonSchemaSort]
associations = ["**/schema.json", "**/*.schema.json"]

[json]
trailingCommas = "maintain"
associations   = ["**/*.json", "**/*.jsonc", "!crates/svg-data/data/**/*.json"]

[typescript]
lineWidth = 150

[markdown]
textWrap     = "always"
emphasisKind = "asterisks"
lineWidth    = 80

[markup]
associations = ["!**/*.svg"]

[ruff]
preview = true

[yaml]
printWidth = 160

[toml]

[exec]
cwd          = "${configDir}"
cacheKey     = "1"
timeout      = 30
playWithFire = true

[[exec.commands]]
command       = "rustfmt +nightly"
exts          = ["rs"]
cacheKeyFiles = ["rustfmt.toml", ".cargo/config.toml", "rust-toolchain.toml"]

[[exec.commands]]
command      = "just --dump --justfile {{file_path}}"
fileNames    = ["justfile"]
setupCommand = "mise --quiet i just"

[[exec.commands]]
command = "zig fmt --color off --stdin"
exts    = ["zig"]

[[exec.commands]]
command = "zig fmt --zon --color off --stdin"
exts    = ["zon"]
